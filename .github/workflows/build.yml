# Bangun ClixMax untuk Windows dan macOS (Linux sebagai eksperimen), uji diri tiap hasilnya, lalu lampirkan
# hasil Windows dan macOS ke Release saat ada tag v*.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: macos-latest   # Apple Silicon (arm64)
          # Eksperimen: versi build Linux kadang crash di Tk (versi dari kode sumber tidak). Tetap dibangun dan
          # diuji supaya kemajuannya terlihat, tapi tidak menggagalkan workflow dan tidak dilampirkan ke rilis.
          - os: ubuntu-22.04
            experimental: true
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental == true }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pasang mpv (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y mpv xvfb

      - name: Pasang mpv (macOS)
        if: runner.os == 'macOS'
        run: brew install mpv

      - name: Pasang paket Python
        run: python -m pip install -r requirements.txt -r packaging/requirements-build.txt

      - name: Build
        if: runner.os != 'Linux'
        run: python packaging/build.py

      - name: Build (Linux, dengan layar virtual supaya modul tray pystray ikut terbungkus)
        if: runner.os == 'Linux'
        run: xvfb-run -a python packaging/build.py

      - name: Uji diri (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\ClixMax\ClixMax.exe -ArgumentList "--selftest=$PWD\selftest.txt" -Wait -PassThru
          Get-Content selftest.txt
          exit $p.ExitCode

      - name: Uji diri (Linux, 5 kali berturut-turut)
        if: runner.os == 'Linux'
        run: |
          failed=0
          for i in 1 2 3 4 5; do
            code=0
            xvfb-run -a dist/ClixMax/ClixMax --selftest="$PWD/selftest$i.txt" || code=$?
            echo "--- percobaan $i, kode keluar $code"
            cat selftest$i.txt 2>/dev/null || echo "(laporan tidak tertulis)"
            [ $code -eq 0 ] || failed=1
          done
          exit $failed

      - name: Uji diri (macOS)
        if: runner.os == 'macOS'
        run: |
          code=0
          dist/ClixMax.app/Contents/MacOS/ClixMax --selftest="$PWD/selftest.txt" || code=$?
          cat selftest.txt
          exit $code

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.experimental && 'eksperimen-' || '' }}ClixMax-${{ runner.os }}
          path: |
            dist/ClixMax-*.zip
            dist/ClixMax-*.tar.gz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          pattern: ClixMax-*   # tanpa artefak eksperimen
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
