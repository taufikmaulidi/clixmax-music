# Bangun ClixMax untuk Windows, Linux, dan macOS, uji diri tiap hasilnya, lalu lampirkan ke Release saat ada tag v*.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: macos-15          # Mac Apple Silicon (arm64); dibangun dan diuji di macOS 15, bukan versi terbaru
          - os: macos-15-intel    # Mac Intel (x64); macOS 15 masih mendukung sebagian Mac Intel
          # Ubuntu 24.04, bukan 22.04: Tk 8.6.12 bawaan 22.04 punya bug crash acak saat gambar kanvas diganti,
          # dan versi build membawa Tk dari mesin build (24.04: Tk 8.6.14, bebas dari bug itu).
          # Akibatnya versi build Linux butuh glibc 2.39 ke atas (Ubuntu 24.04, Debian 13, Fedora 40, dst).
          - os: ubuntu-24.04
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # mpv sengaja tidak dipasang di sini: paket .deb ClixMax yang harus menariknya (libmpv2) lewat apt.
      - name: Pasang layar virtual (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Pasang mpv (macOS)
        if: runner.os == 'macOS'
        run: brew install mpv

      - name: Pasang Inno Setup (Windows, untuk installer)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Pasang paket Python
        run: python -m pip install -r requirements.txt -r packaging/requirements-build.txt

      - name: Versi dari tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: echo "CLIXMAX_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build
        if: runner.os != 'Linux'
        run: python packaging/build.py

      - name: Build (Linux, dengan layar virtual supaya modul tray pystray ikut terbungkus)
        if: runner.os == 'Linux'
        run: xvfb-run -a python packaging/build.py

      # Uji diri gagal bila ClixMax menjalankan program lain (mpv, yt-dlp, deno): di ketiga OS mpv dimuat sebagai
      # libmpv dan yt-dlp sebagai modul, semuanya di dalam proses ClixMax.
      - name: Uji diri (Windows, dari installer)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = (Get-ChildItem dist\ClixMax-windows-*-setup.exe).FullName
          $dir = "$env:RUNNER_TEMP\ClixMax"
          $i = Start-Process -FilePath $setup -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=$dir" -Wait -PassThru
          if ($i.ExitCode -ne 0) { Write-Error "installer gagal, kode $($i.ExitCode)"; exit 1 }
          $p = Start-Process -FilePath "$dir\ClixMax.exe" -ArgumentList "--selftest=$PWD\selftest.txt" -Wait -PassThru
          Get-Content selftest.txt
          exit $p.ExitCode

      # Dipasang dari .deb (apt sekalian memasang libmpv), lalu perintah clixmax yang terpasang yang diuji.
      - name: Uji diri (Linux, dari .deb, 20 kali berturut-turut; crash acak harus benar-benar hilang)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y ./dist/ClixMax-linux-*.deb
          failed=0
          for i in $(seq 1 20); do
            code=0
            xvfb-run -a clixmax --selftest="$PWD/selftest$i.txt" || code=$?
            echo "--- percobaan $i, kode keluar $code"
            cat selftest$i.txt 2>/dev/null || echo "(laporan tidak tertulis)"
            [ $code -eq 0 ] || failed=1
          done
          exit $failed

      # ClixMax.app dijalankan langsung dari .dmg yang dibuka, sama seperti yang diterima pengguna.
      - name: Uji diri (macOS, dari .dmg)
        if: runner.os == 'macOS'
        run: |
          hdiutil attach -nobrowse -readonly -mountpoint "$RUNNER_TEMP/dmg" dist/ClixMax-macos-*.dmg
          code=0
          "$RUNNER_TEMP/dmg/ClixMax.app/Contents/MacOS/ClixMax" --selftest="$PWD/selftest.txt" || code=$?
          cat selftest.txt
          hdiutil detach "$RUNNER_TEMP/dmg"
          exit $code

      - uses: actions/upload-artifact@v4
        with:
          name: ClixMax-${{ matrix.os }}
          path: |
            dist/ClixMax-*.zip
            dist/ClixMax-*.tar.gz
            dist/ClixMax-*-setup.exe
            dist/ClixMax-*.dmg
            dist/ClixMax-*.deb
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          pattern: ClixMax-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
