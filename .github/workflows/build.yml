# Bangun ClixMax untuk Windows, Linux, dan macOS, uji diri tiap hasilnya, lalu lampirkan ke Release saat ada tag v*.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: macos-latest   # Apple Silicon (arm64)
          # Ubuntu 24.04, bukan 22.04: Tk 8.6.12 bawaan 22.04 punya bug crash acak saat gambar kanvas diganti,
          # dan versi build membawa Tk dari mesin build (24.04: Tk 8.6.14, bebas dari bug itu).
          # Akibatnya versi build Linux butuh glibc 2.39 ke atas (Ubuntu 24.04, Debian 13, Fedora 40, dst).
          - os: ubuntu-24.04
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pasang mpv (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y mpv xvfb

      - name: Pasang mpv (macOS)
        if: runner.os == 'macOS'
        run: brew install mpv

      - name: Pasang paket Python
        run: python -m pip install -r requirements.txt -r packaging/requirements-build.txt

      - name: Build
        if: runner.os != 'Linux'
        run: python packaging/build.py

      - name: Build (Linux, dengan layar virtual supaya modul tray pystray ikut terbungkus)
        if: runner.os == 'Linux'
        run: xvfb-run -a python packaging/build.py

      - name: Uji diri (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\ClixMax\ClixMax.exe -ArgumentList "--selftest=$PWD\selftest.txt" -Wait -PassThru
          Get-Content selftest.txt
          exit $p.ExitCode

      - name: Uji diri (Linux, 20 kali berturut-turut; crash acak harus benar-benar hilang)
        if: runner.os == 'Linux'
        run: |
          failed=0
          for i in $(seq 1 20); do
            code=0
            xvfb-run -a dist/ClixMax/ClixMax --selftest="$PWD/selftest$i.txt" || code=$?
            echo "--- percobaan $i, kode keluar $code"
            cat selftest$i.txt 2>/dev/null || echo "(laporan tidak tertulis)"
            [ $code -eq 0 ] || failed=1
          done
          exit $failed

      - name: Uji diri (macOS)
        if: runner.os == 'macOS'
        run: |
          code=0
          dist/ClixMax.app/Contents/MacOS/ClixMax --selftest="$PWD/selftest.txt" || code=$?
          cat selftest.txt
          exit $code

      - uses: actions/upload-artifact@v4
        with:
          name: ClixMax-${{ runner.os }}
          path: |
            dist/ClixMax-*.zip
            dist/ClixMax-*.tar.gz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          pattern: ClixMax-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
